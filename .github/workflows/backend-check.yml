name: Backend validation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run backend regression tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v

      - name: Import API and verify message routes
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from app.main import JustificationSubmitRequest, app
          paths = {route.path for route in app.routes}
          assert '/health' in paths
          assert '/ready' in paths
          assert '/v1/sync' in paths
          assert '/v1/message/recipients' in paths
          assert '/v1/message/send' in paths
          assert '/v1/message/reply' in paths
          assert '/v1/message/attachment' in paths
          assert '/v1/homework/attachment' in paths
          assert '/v1/justification/submit' in paths
          payload = JustificationSubmitRequest(
              profile='parent', login='test', password='test',
              date_from='2026-11-13', date_to='2026-11-13',
              lessons=[1], message_from_parent='Test'
          )
          assert payload.lessons == [1]
          print('Backend API routes and justification request model loaded successfully.')
          PY
