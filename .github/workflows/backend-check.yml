name: Backend validation

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Import API and verify message routes
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app; paths = {route.path for route in app.routes}; assert '/v1/message/recipients' in paths; assert '/v1/message/send' in paths; assert '/v1/message/reply' in paths; assert '/v1/message/attachment' in paths; print('Backend API routes loaded successfully.')"
