name: Build EduFlow APK

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Nie znaleziono sdkmanager: $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Check project files
        shell: bash
        run: |
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/pl/domreksio/librusallinone/MainActivity.kt

      - name: Prepare stable release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/librus-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Znaleziono komplet sekretow podpisu. Powstanie APK release."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak kompletu sekretow podpisu. Powstanie tylko APK debug do testow; nie instaluj go jako aktualizacji wydania."
          fi

      - name: Run Android lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace

      - name: Run Android emulator smoke tests
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-boot-timeout: 1200
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash -c 'set -e; trap "mkdir -p \"$RUNNER_TEMP\"; adb devices -l > \"$RUNNER_TEMP/android-adb-devices.txt\" 2>&1 || true; adb logcat -d -v threadtime > \"$RUNNER_TEMP/android-emulator-logcat.txt\" 2>&1 || true; adb shell dumpsys activity activities > \"$RUNNER_TEMP/android-emulator-activities.txt\" 2>&1 || true; adb shell dumpsys meminfo > \"$RUNNER_TEMP/android-emulator-meminfo.txt\" 2>&1 || true" EXIT; adb wait-for-device; adb shell \'for i in $(seq 1 60); do [ "$(getprop sys.boot_completed)" = "1" ] && exit 0; sleep 2; done; exit 1\'; sleep 5; ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell am instrument -w pl.domreksio.librusallinone.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/android-instrumentation-result.txt" 2>&1; cat "$RUNNER_TEMP/android-instrumentation-result.txt"; grep -Eq "OK \\([0-9]+ tests?\\)" "$RUNNER_TEMP/android-instrumentation-result.txt"; ! grep -q "FAILURES!!!" "$RUNNER_TEMP/android-instrumentation-result.txt"'

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-Instrumentation-Diagnostics
          path: |
            ${{ runner.temp }}/android-emulator-logcat.txt
            ${{ runner.temp }}/android-emulator-activities.txt
            ${{ runner.temp }}/android-emulator-meminfo.txt
            ${{ runner.temp }}/android-adb-devices.txt
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-Lint-Report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED_FINGERPRINT="3fca390f450c25e61189ea605978ce4860a0482a7a95f748406e5ed9ee046e94"
          ACTUAL_FINGERPRINT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EduFlow-APK-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK (CI only)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (CI only)
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EduFlow-APK-DEBUG-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            echo "### EduFlow APK: RELEASE" >> "$GITHUB_STEP_SUMMARY"
            echo "APK jest podpisany stalym kluczem wydawniczym." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### EduFlow APK: DEBUG ONLY" >> "$GITHUB_STEP_SUMMARY"
            echo "Brak sekretow podpisu. Ten plik sluzy tylko do testow i nie jest stabilnym wydaniem." >> "$GITHUB_STEP_SUMMARY"
          fi
