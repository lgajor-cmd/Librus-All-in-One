name: Build Librus APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'improve/**'
      - 'fix/**'
      - 'release/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Nie znaleziono sdkmanager: $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check project files
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/pl/domreksio/librusallinone/MainActivity.kt

      - name: Prepare stable release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/librus-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Znaleziono komplet sekretow podpisu. Powstanie APK release."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak kompletu sekretow podpisu. Powstanie tylko APK debug do testow; nie instaluj go jako aktualizacji wydania."
          fi

      - name: Run Android lint
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Lint-Report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify signed release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED_FINGERPRINT="3fca390f450c25e61189ea605978ce4860a0482a7a95f748406e5ed9ee046e94"
          ACTUAL_FINGERPRINT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Librus-All-in-One-APK-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK (CI only)
        if: steps.signing.outputs.available != 'true'
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK (CI only)
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Librus-All-in-One-APK-DEBUG-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            echo "### Librus APK: RELEASE" >> "$GITHUB_STEP_SUMMARY"
            echo "APK jest podpisany stalym kluczem wydawniczym." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Librus APK: DEBUG ONLY" >> "$GITHUB_STEP_SUMMARY"
            echo "Brak sekretow podpisu. Ten plik sluzy tylko do testow i nie jest stabilnym wydaniem." >> "$GITHUB_STEP_SUMMARY"
          fi
